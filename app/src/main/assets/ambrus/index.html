<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>Ambrus — Web Copier &amp; Analyzer</title>
<link rel="stylesheet" href="style.css">
<style>
.brand img.logo-img{width:34px;height:34px;border-radius:10px;object-fit:cover;display:block;background:#0b1020}
button.primary{background:linear-gradient(135deg,var(--acc),#3d6fe0)!important;font-weight:700;font-size:16px;padding:14px}
.load-card{text-align:center;padding:28px 16px}
.spinner{width:36px;height:36px;margin:0 auto 12px;border:3px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.bar{height:6px;background:var(--panel2);border-radius:99px;overflow:hidden;margin-top:12px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:99px}
button:disabled{opacity:.45;pointer-events:none}
button.full{width:100%}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <img class="logo-img" src="logo.png" alt="Ambrus" width="34" height="34">
    <div><b>Ambrus</b><small id="subtitle">Web Copier &amp; Analyzer</small></div>
  </div>
  <div class="top-actions">
    <span id="modeBadge" class="badge">DEMO</span>
    <button id="btnProject" class="chip">Proyek: –</button>
  </div>
</header>

<main id="view" aria-live="polite"></main>

<nav class="bottomnav" id="nav">
  <a href="#/home" data-r="home"><i>⌂</i>Beranda</a>
  <a href="#/projects" data-r="projects"><i>▤</i>Proyek</a>
  <a href="#/more" data-r="more"><i>☰</i>Lainnya</a>
</nav>

<div id="toast" class="toast" role="status"></div>
<script src="app.js"></script>
</body>
</html>
