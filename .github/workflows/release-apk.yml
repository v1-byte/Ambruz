name: Build & Release APK
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;34.0.0

      - name: Grant execute
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Package APK
        run: |
          APK=$(find app/build/outputs/apk -name "*.apk" | head -1)
          echo "APK=$APK"
          ls -la "$APK"
          cp "$APK" Ambrus-debug.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ambrus-debug-apk
          path: Ambrus-debug.apk
          retention-days: 30

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Ambrus-debug.apk
          name: Ambrus ${{ github.ref_name }}
          body: |
            ## Ambrus APK (debug)
            - Splash logo + UI WebView
            - Preview & Rekam sebelum copy
            - Scan, analisis, ekspor ZIP
            Install: Settings → izinkan install dari sumber tidak dikenal → buka APK.
          generate_release_notes: true

      - name: Update latest release (on main)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Ambrus — latest (debug)
          prerelease: true
          files: Ambrus-debug.apk
          body: |
            Build otomatis dari commit `${{ github.sha }}`.
            APK **debug** untuk uji instal langsung (belum signed Play Store).
