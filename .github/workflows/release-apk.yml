name: Build & Release APK
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;34.0.0" "platform-tools"

      - name: Grant execute
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: Find APK
        id: apk
        run: |
          APK=$(find app/build/outputs/apk -name "*.apk" | head -1)
          echo "path=$APK" >> $GITHUB_OUTPUT
          ls -la app/build/outputs/apk/debug/ || true
          cp "$APK" Ambrus-debug.apk
          echo "Built: $APK"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ambrus-debug-apk
          path: Ambrus-debug.apk
          retention-days: 30

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Ambrus-debug.apk
          name: Ambrus ${{ github.ref_name }}
          body: |
            APK debug build Ambrus Web Copier & Analyzer.
            Install: izinkan sumber tidak dikenal, buka file APK.
            Fitur: splash logo, Preview & Rekam, scan, ekspor ZIP.
          generate_release_notes: true

      - name: Update latest release (on main)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Ambrus — latest (debug)
          prerelease: true
          files: Ambrus-debug.apk
          body: |
            Build otomatis dari commit `${{ github.sha }}`.
            APK debug — untuk uji instal langsung (bukan Play Store release signed).
